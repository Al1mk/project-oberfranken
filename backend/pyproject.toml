[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oberfranken-rag"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.0,<2",
    "fastapi>=0.115,<1",
    "sentence-transformers>=5,<6",
    "uvicorn>=0.30,<1",
]

[project.scripts]
oberfranken-rag = "oberfranken_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

